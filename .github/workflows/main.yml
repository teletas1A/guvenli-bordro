name: Windows uygulamasini derle

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: guvenli-bordro-github

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: WhatsApp gonderici programini derle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force helper/bin | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /target:winexe /optimize+ `
            /win32icon:./build/icon.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll `
            /out:./helper/bin/GuvenliBordroGonderici.exe ./helper/GuvenliBordro.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Paketleri yukle
        run: npm install

      - name: Kurulum dosyasini olustur
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Kurulum dosyasini indirmeye hazirla
        uses: actions/upload-artifact@v4
        with:
          name: GuvenliBordro-Kurulum
          path: guvenli-bordro-github/dist/*.exe

      - name: Surum yayinla (v ile baslayan etiketlerde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: guvenli-bordro-github/dist/*.exe
